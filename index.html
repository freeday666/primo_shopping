<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Bot Hosting</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #111827, #202b46);
    }

    main {
      width: min(90%, 620px);
      padding: 56px 32px;
      text-align: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .badge {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 14px;
      color: #c7d2fe;
      background: rgba(88, 101, 242, 0.18);
      border-radius: 999px;
      font-size: 14px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 7vw, 3.5rem);
    }

    p {
      margin: 0 auto 30px;
      max-width: 460px;
      color: #cbd5e1;
      line-height: 1.7;
    }

    .discord-button {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 15px 24px;
      color: white;
      background: #5865f2;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.2s, transform 0.2s;
    }

    .discord-button:hover {
      background: #4752c4;
      transform: translateY(-2px);
    }

    .discord-button svg {
      width: 25px;
      height: 25px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Snel • Betrouwbaar • 24/7 online</span>
    <h1>Discord Bot Hosting</h1>
    <p>
      Host je Discord-bot eenvoudig en houd hem altijd online.
      Sluit je aan bij onze community voor meer informatie en hulp.
    </p>

    <a
      class="discord-button"
      href="https://discord.gg/p7z48sCBZE"
      target="_blank"
      rel="noopener noreferrer"
    >

</html>
