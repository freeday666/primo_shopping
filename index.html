<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ticket Systeem</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet" />
<!-- Font Awesome voor iconen (optioneel) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
  /* Reset en basisstijl */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Inter', sans-serif;
    /* Moderne achtergrond met gradient en animatie */
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    background-size: 400% 400%;
    animation: gradientAnimation 20s ease infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    color: #fff;
  }

  @keyframes gradientAnimation {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
  }

  /* Header met logo en banner */
  header {
    width: 100%;
    max-width: 1200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 20px;
    position: relative;
  }

  /* Logo banner */
  .logo {
    display: flex;
    align-items: center;
    gap: 15px;
    font-size: 2rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: 2px;
    padding: 10px 20px;
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    backdrop-filter: blur(10px);
    animation: floatDown 2s ease-out;
  }

  @keyframes floatDown {
    from { transform: translateY(-20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* Banner onder logo */
  .banner {
    margin-top: 10px;
    font-size: 1.2rem;
    color: #ccc;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
  }

  /* Titel */
  h1 {
    font-size: 2.5em;
    margin-bottom: 20px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  }

  /* Buttons stijl */
  button {
    background: #5865F2;
    border: none;
    padding: 15px 30px;
    border-radius: 50px;
    font-size: 1.2em;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 8px 15px rgba(0,0,0,0.2);
    margin-top: 20px;
    transition: all 0.3s ease;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }

  button:hover {
    background: #3b4b9d;
    box-shadow: 0 12px 20px rgba(0,0,0,0.3);
    transform: translateY(-2px);
  }

  /* Tickets container */
  .tickets {
    margin-top: 40px;
    width: 100%;
    max-width: 1000px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Ticket stijl */
  .ticket {
    background: rgba(255,255,255,0.1);
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 8px 15px rgba(0,0,0,0.2);
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
    animation: fadeIn 0.5s ease forwards;
  }

  .ticket h2 {
    margin-bottom: 10px;
  }

  .ticket p {
    margin-bottom: 10px;
  }

  /* Animatie voor tickets */
  @keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
  }

  /* Footer met Discord link */
  footer {
    margin-top: 40px;
    font-size: 1rem;
    text-align: center;
    color: #aaa;
  }

  footer a {
    color: #66fcf1;
    text-decoration: none;
    font-weight: 600;
  }

  footer a:hover {
    color: #45a29e;
  }

  /* Extra styling voor kleine schermen */
  @media(max-width: 600px) {
    h1 {
      font-size: 2em;
    }
    button {
      padding: 12px 24px;
      font-size: 1rem;
    }
  }
</style>
</head>
<body>

<!-- Header met logo en banner -->
<header>
  <div class="logo">
    <i class="fas fa-ticket-alt"></i> TicketSysteem
  </div>
  <div class="banner">Snelle en makkelijke support tickets</div>
</header>

<h1>Ticket Systeem</h1>
<button id="createTicket"><i class="fas fa-plus"></i> Maak een nieuw ticket</button>

<div class="tickets" id="ticketsContainer">
  <!-- Tickets worden hier geladen -->
</div>

<!-- Scripts -->
<script>
  document.getElementById('createTicket').addEventListener('click', () => {
    // API call om ticket te maken
    fetch('/api/create-ticket', {method: 'POST'})
      .then(res => res.json())
      .then(data => {
        addTicketToDOM(data.ticketId, data.ticketLink);
      });
  });

  function addTicketToDOM(id, link) {
    const container = document.getElementById('ticketsContainer');
    const div = document.createElement('div');
    div.className = 'ticket';
    div.innerHTML = `
      <h2>Ticket #${id}</h2>
      <p>Link: <a href="${link}" target="_blank" style="color:#66fcf1;">${link}</a></p>
      <button style="background:#e74c3c;" onclick="closeTicket('${id}')"><i class="fas fa-times"></i> Sluit Ticket</button>
    `;
    container.appendChild(div);
  }

  function closeTicket(id) {
    // API call om ticket te sluiten
    fetch('/api/close-ticket', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ticketId: id})
    }).then(res => res.json())
      .then(() => {
        alert('Ticket gesloten');
        // Ticket verwijderen of markeren
        const tickets = document.querySelectorAll('.ticket');
        tickets.forEach(t => {
          if(t.querySelector('h2').innerText.includes(`#${id}`)) {
            t.style.opacity = '0';
            setTimeout(() => t.remove(), 300);
          }
        });
      });
  }
</script>

</body>
</html>
